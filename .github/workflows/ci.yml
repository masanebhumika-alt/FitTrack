name: FitTrack CI

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    name: Backend - test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
          POSTGRES_DB: fittrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fittrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # throwaway CI-only values, not real secrets
      DATABASE_URL: postgresql://fittrack:fittrack@localhost:5432/fittrack?schema=public
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend - test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the safe template
        run: cp .env.example .env
      - run: docker compose build

  cd:
    name: CD - publish images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fittrack-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fittrack-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fittrack-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fittrack-frontend:${{ github.sha }}
