groups:
  - name: fittrack
    rules:
      - alert: BackendDown
        expr: up{job="fittrack-backend"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "FitTrack backend is down" }
      - alert: HighErrorRate
        expr: sum(rate(fittrack_http_requests_total{status=~"5.."}[2m])) / sum(rate(fittrack_http_requests_total[2m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests are failing" }
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(fittrack_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "p95 latency above 1 second" }
