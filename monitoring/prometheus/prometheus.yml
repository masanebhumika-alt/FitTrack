global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fittrack-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ['backend:4000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
