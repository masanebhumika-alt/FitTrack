services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fittrack
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U fittrack -d fittrack"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://fittrack:${POSTGRES_PASSWORD}@db:5432/fittrack?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
    ports: ["4000:4000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [backend]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  pgdata:
  grafana-data:
